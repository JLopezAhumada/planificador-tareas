<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Planificador de Tareas</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <nav class="navbar navbar-dark bg-primary">
    <div class="container">
      <span class="navbar-brand mb-0 h1">Planificador de Tareas</span>
    </div>
  </nav>

  <main class="container my-4">
    <div class="row g-4">
      <!-- Formulario para crear una tarea -->
      <section class="col-lg-4">
        <div class="card shadow-sm">
          <div class="card-body">
            <h2 class="h5 card-title mb-3">Nueva tarea</h2>
            <form id="newTaskForm">
              <div class="mb-3">
                <label for="newTaskNameInput" class="form-label">Nombre</label>
                <input type="text" class="form-control" id="newTaskNameInput" placeholder="Ej: Estudiar para el parcial">
              </div>
              <div class="mb-3">
                <label for="newTaskDescriptionInput" class="form-label">Descripción</label>
                <textarea class="form-control" id="newTaskDescriptionInput" rows="3" placeholder="Describe la tarea"></textarea>
              </div>
              <div class="mb-3">
                <label for="newTaskDateInput" class="form-label">Fecha de entrega</label>
                <input type="date" class="form-control" id="newTaskDateInput">
              </div>
              <div class="mb-3">
                <label for="newTaskStatusInput" class="form-label">Estado</label>
                <select class="form-select" id="newTaskStatusInput">
                  <option value="">Selecciona un estado</option>
                  <option value="Pendiente">Pendiente</option>
                  <option value="En progreso">En progreso</option>
                  <option value="Completada">Completada</option>
                </select>
              </div>
              <button type="submit" class="btn btn-primary w-100">Agregar tarea</button>
            </form>
          </div>
        </div>
      </section>
    </div>
  </main>
</body>
</html>
